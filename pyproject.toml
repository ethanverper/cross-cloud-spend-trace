[project]
name = "cross-cloud-spend-trace-api"
version = "0.1.0"
description = "Phase 5: pure JSON API serving Phase 3's already-computed analytics output (spend, anomalies, forecast, optimization suggestions) to the React dashboard, plus the built frontend's static assets in production. See docs/decisions/0006-phase5-dashboard-api-architecture.md."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=14",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.uv.workspace]
members = [
    "collectors/common",
    "collectors/aws",
    "collectors/snowflake",
    "collectors/databricks",
    "analytics",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
