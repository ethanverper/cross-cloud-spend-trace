[project]
name = "spend-lens-analytics"
version = "0.1.0"
description = "Phase 3: PySpark aggregation, anomaly detection, forecast, and optimization-rules engine over the shared raw store. Runs locally (pyspark local mode) and is packaged so the same code can run as a Databricks notebook/job against synced data."
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5,<4.0",
    "spend-lens-common",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
spend-lens-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spend_lens_analytics"]
