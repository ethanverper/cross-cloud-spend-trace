[project]
name = "spend-lens-aws-collector"
version = "0.1.0"
description = "AWS Cost Explorer/Billing collector — lands daily cost-by-service usage, month-end forecast, and active service dimensions into the shared raw store."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "spend-lens-common",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
spend-lens-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_collector"]
