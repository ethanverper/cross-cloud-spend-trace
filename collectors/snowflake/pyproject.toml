[project]
name = "spend-lens-snowflake-collector"
version = "0.1.0"
description = "Snowflake query-history-based cost attribution collector — lands QUERY_HISTORY and WAREHOUSE_METERING_HISTORY (ACCOUNT_USAGE) into the shared raw store."
requires-python = ">=3.11"
dependencies = [
    "snowflake-connector-python>=3.12",
    "spend-lens-common",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
spend-lens-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowflake_collector"]
