[project]
name = "cross-cloud-spend-trace-common"
version = "0.1.0"
description = "Shared schema, config, and raw-store writer used by every cross-cloud-spend-trace source collector."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cross_cloud_spend_trace_common"]
